  introduction:
    - title: "What I work on"
      content: "I build agents that act on physical systems. A language model proposes, a real solver validates, and something in the world executes - a robot arm, or a fuel-break budget someone has to fund. The interesting part is never the model; it is the layer that refuses to let the model hallucinate a joint angle or a parcel boundary."
    - title: "Two tracks"
      content: "Robotics and embodied AI - agent layers over dataflow runtimes, motion planning, simulation-to-hardware bridges. And geospatial decision support - wildfire economics, native species suitability modeling, and planning tools that land managers can open in a browser."
